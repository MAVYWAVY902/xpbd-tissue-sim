  ## ============================================================
  ## NOTES ON TEXTURE MAPPING:
  ## ============================================================
  ## 1. How to create OBJ with UV coordinates:
  ##    - Open your OBJ in Blender
  ##    - Select mesh → Tab (Edit Mode) → A (Select All) → U key
  ##    - Choose "Smart UV Project" → OK
  ##    - File → Export → Wavefront (.obj)
  ##    - Check "Include UVs" option
  ##
  ## 2. Texture file formats:
  ##    - PNG (recommended, supports transparency)
  ##    - Currently only PNG is supported via vtkPNGReader
  ##
  ## 3. UV coordinate requirements:
  ##    - Range: 0.0 to 1.0 (normalized)
  ##    - (0,0) = bottom-left, (1,1) = top-right
  ##
  ## 4. Troubleshooting:
  ##    - If texture doesn't show: check if OBJ has "vt" lines
  ##    - If stretched: UV unwrapping might need adjustment in Blender
  ##    - If black: check PNG file path is correct and accessible
  ## ============================================================
