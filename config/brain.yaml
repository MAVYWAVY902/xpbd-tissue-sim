## NOTE: not all parameters below are required - the Simulation class and all Object classes have many default parameters

name: "Example"  # name of the simulation
description: "Example simulation" # description of the simulation

visualization: "Easy3D" # what graphics to use ('Easy3D' for Easy3D graphics or 'None' for no graphics)

g-accel: 0 # downward acceleration due to gravity (in the z-direction) [m/s2]

## different simulation "modes"
# sim-mode: "Frame-by-frame"  # "Frame-by-frame" lets you advance the simulation one frame at a time by pressing any key
# sim-mode: "Visualization"     # "Visualization" runs the simulation at 'real-time' such that sim time = wall clock time (good for interaction)
sim-mode: "AFAP"            # "AFAP" runs the simulation As Fast As Possible, without caring if sim time is going faster than wall clock time

time-step: 2e-4   # simulation time step [s]
collision-rate: 60 # rate at which to run collision detection [Hz] 
fps: 60 # frames per second of the visualization (higher for smooth interaction)
end-time: 100 # end time of the simulation [s]

## ==================== BOUNDARY FIXING OPTIONS ====================
## Simulate brain stem connection - fix vertices to prevent whole-object translation
fix-min-z: true         # Fix BOTTOM vertices (posterior/brain stem) - RECOMMENDED for brain
fix-max-z: true         # Fix TOP vertices (superior/ceiling)
fix-min-y: true         # Fix BACK vertices (posterior wall)
fix-max-y: true         # Fix FRONT vertices (anterior wall)
fix-min-x: true         # Fix LEFT vertices
fix-max-x: true         # Fix RIGHT vertices

## ==================== ADHESION CONSTRAINT SETTINGS ====================
## Rigid-Deform Adhesion: Bonds between rigid objects and deformable tissue
rigid-deform-adhesion-enable: false           # Enable/disable rigid-deform adhesion
rigid-deform-adhesion-rest-gap: 0.005         # 5mm rest gap - target separation distance
rigid-deform-adhesion-break-ratio: 2.0        # Break at 100% strain (separation = 2x rest_gap)
rigid-deform-adhesion-alpha: 1e-5             # Compliance (lower = stiffer spring)
rigid-deform-adhesion-bond-distance: 0.010    # 10mm - initial search radius for creating bonds

# nerve stretch constraint testing
# To enable/disable nerve constraints for comparison tests, use environment variables:
# export NERVE_ENABLE=1        # Enable nerve constraints (default)
# export NERVE_ENABLE=0        # Disable nerve constraints for comparison
# export NERVE_MSH="../resource/cube/cube8_nerve.msh"  # Path to mesh with nerve lines
# export NERVE_PHYS="nerve_edge"  # Name of physical line in mesh (default)

## define elastic materials
materials:
  -
    name: "Soft Tissue"
    density: 1000   # density [kg/m^3]
    E: 8e3    # Young's modulus [Pa]
    nu: 0.45  # Poisson's ratio [-]
    mu-s: 1.1 # coefficient of static friction [-]
    mu-k: 0.7 # coefficient of kinetic friction [-]

## objects in the simulation
objects:

  ## example deformable object
  -
    name: "DeformableMesh"

    ## type of object
    type: "FirstOrderXPBDMeshObject"  # use the 1st-order XPBD method
    # type: "XPBDMeshObject"          # use the standard, 2nd-order XPBD method

    ## filename to load from (.msh is GMSH's volumetric mesh format, but if .obj or .stl is provided, will automatically turn surface mesh to volume mesh)
    # filename: "../resource/general/stanford_bunny_lowpoly.msh"
    # filename: "../resource/cube/cube8.msh"
    # filename: "../resource/general/single.msh"
    # filename: "../resource/cube/cube8_nerve_y.msh"
    # filename: "../resource/cube/cube16.msh"
    # filename: "../resource/beam/10x1x1_subdivided16_beam.msh"
    # filename: "../resource/tissue/Prostate.msh"
    # filename: "../resource/tissue/Trachea_processed.stl"
    # filename: "../resource/tissue/tracheal_tumor.msh"
    # filename: "../resource/tumor_fixed/tumor_fixed01.obj"  # Original OBJ without UV
    filename: "../resource/brain_fixed/brain_scale03.obj"  # OBJ with UV coordinates

    materials: ["Soft Tissue"] # the elastic material (must match with the name of a material defined above)
    
    ## PNG texture file - Easy3D texture mapping enabled!
    texture-file: "../resource/textures/AlbedoLiver2.png"

    ## visualization options
    color: [1.0, 1.0, 1.0]  # White color so texture shows through
    draw-points: false  # draw mesh points
    draw-edges: false    # draw mesh edges
    draw-faces: true    # draw mesh faces

    ## initial configuration
    use-original-coords: true   # Allow position adjustment
    max-size: 0.05               # Keep original size (no scaling)
    position: [0, 0, 0]          # Will be centered at origin
    velocity: [0, 0, 0.0]        # initial velocity [m/s]
    rotation: [0, 0, 0]          # No rotation

    ## collisions
    collisions: true   # ENABLED: Detect collisions with other objects

    ## XPBD-specific options
    num-solver-iters: 3   # number of solver loop iterations per time step 
    
    solver-type: "Gauss-Seidel"   # use Gauss-Seidel solver (serial)
    # solver-type: "Jacobi"       # use Jacobi solver (now with OpenMP parallelization!)
    # solver-type: "Parallel-Jacobi"  # use parallelized Jacobi solver (note: unstable and requires GPU)

    constraint-type: "Stable-Neohookean-Combined"   # use Stable Neohookean constraints with 2x2 block constraint solve for each tet element
    # constraint-type: "Stable-Neohookean"          # use Stable Neohookean constraints with separate constraint solve for each tet element

    # residual-policy: "Every-Substep"    # compute the residuals after every time step
    residual-policy: "Never"              # don't compute the residuals

    ## 1st-Order XPBD options (has no effect on XPBDMeshObject)
    damping-multiplier: 200000   # 'b' from the 1st-Order XPBD paper
  



