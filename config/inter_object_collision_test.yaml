## Inter-Object Deformable Collision Test Configuration
## Tests collision detection between two deformable objects (cube1 and cube2)

name: "Inter-Object Collision Test"
description: "Testing deformable-deformable collision between two cubes"

visualization: "Easy3D" # Run headless to bypass graphics crash

g-accel: 0 # downward acceleration due to gravity [m/s2]

sim-mode: "AFAP"     # Run as fast as possible for testing

time-step: 1e-4   # 1ms timestep (5x larger = 5x faster)
collision-rate: 60  # Collision detection every 50ms (5x less frequent = 5x faster)
collision-algorithm: "embree"  # Options: "auto", "brute-force", "embree" 
                             # auto: use brute-force for <2000 faces, embree for >=2000 faces
fps: 60 # frames per second of the visualization
end-time: 200 # test time

## ==================== GRASPING/PUSHING TOOL SETTINGS ====================
grasp-radius: 0.013   # Grasping tool radius: 13mm (default 100mm)
tool-radius: 0.013    # Pushing tool radius: 13mm (default 200mm)

## define elastic materials
materials:
  -
    name: "Soft Tissue"
    density: 1000   # density [kg/m^3]
    E: 10e4    # Young's modulus [Pa] - increased stiffness for stability
    nu: 0.45  # Poisson's ratio [-]
    mu-s: 0.0 # coefficient of static friction [-]
    mu-k: 0.0 # coefficient of kinetic friction [-]

## objects in the simulation
objects:

  ## First deformable cube
  -
    name: "Cube1"
    type: "FirstOrderXPBDMeshObject"
    filename: "../resource/brain_fixed/brain_scale02.obj"
    materials: ["Soft Tissue"]

    ## visualization options
    color: [1.0, 0.0, 0.0] # red cube (RGB only, like config.yaml)
    draw-points: false
    draw-edges: true
    draw-faces: true

    ## initial configuration
    use-original-coords: false
    max-size: 0.05
    position: [-0.03, 0, 0]  # Move 30mm to left to separate from Cube2
    velocity: [0.0, 0, -0.0]  # Very slow velocity for stability testing
    rotation: [0, 0, 0]

    ## collisions
    collisions: true
    inter-object-collisions: true

    ## XPBD-specific options
    num-solver-iters: 3  # Start with fewer iterations for stability
    solver-type: "Gauss-Seidel"
    constraint-type: "Stable-Neohookean-Combined"
    residual-policy: "Never"
    
    damping-multiplier: 1500000  # Reduced from 6M for better performance


  ## Second deformable cube
  -
    name: "Cube2"
    type: "FirstOrderXPBDMeshObject"
    filename: "../resource/tumor_fixed/tumor_fixed01.obj"

    materials: ["Soft Tissue"]

    ## visualization options
    color: [0.0, 0.0, 1.0] # blue cube (RGB only, like config.yaml)
    draw-points: false
    draw-edges: true
    draw-faces: true

    ## initial configuration
    use-original-coords: false
    max-size: 0.05
    position: [0.0, 0, 0]  # Move 30mm to right to separate from Cube1
    velocity: [-0.0, 0, 0]  # Very slow velocity
    rotation: [0, 0, 0]

    ## collisions
    collisions: true
    inter-object-collisions: true

    ## XPBD-specific options
    num-solver-iters: 3  # Start with fewer iterations for stability
    solver-type: "Gauss-Seidel"
    # solver-type: "Jacobi"

    
    constraint-type: "Stable-Neohookean-Combined"
    residual-policy: "Never"
    
    damping-multiplier: 1500000  # Reduced from 6M for better performance


