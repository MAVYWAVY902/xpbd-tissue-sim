## Inter-Object Deformable Collision Test Configuration
## Tests collision detection between two deformable objects (cube1 and cube2)

name: "Inter-Object Collision Test"
description: "Testing deformable-deformable collision between two cubes"

visualization: "Easy3D" # Easy3D graphics

g-accel: 9.81 # downward acceleration due to gravity [m/s2]

sim-mode: "Visualization"     # "Visualization" runs at real-time

time-step: 1e-3   # simulation time step [s]
collision-rate: 1000 # rate at which to run collision detection [Hz] 
fps: 30 # frames per second of the visualization
end-time: 100 # end time of the simulation [s]

## define elastic materials
materials:
  -
    name: "Soft Tissue"
    density: 1000   # density [kg/m^3]
    E: 2e5    # Young's modulus [Pa]
    nu: 0.45  # Poisson's ratio [-]
    mu-s: 0.0 # coefficient of static friction [-]
    mu-k: 0.0 # coefficient of kinetic friction [-]

## objects in the simulation
objects:

  ## First deformable cube
  -
    name: "Cube1"
    type: "XPBDMeshObject"
    filename: "../resource/cube/cube8.msh"
    materials: ["Soft Tissue"]

    ## visualization options
    color: [1.0, 0.0, 0.0, 1.0] # red cube
    draw-points: false
    draw-edges: true
    draw-faces: true

    ## initial configuration
    max-size: 0.5   # 0.5m cube
    position: [-0.3, 0, 1.0]   # positioned to the left, 1m above ground
    velocity: [0.2, 0, -0.5]   # moving right and downward - will collide with cube2
    rotation: [0, 0, 0]

    ## collisions
    collisions: true
    self-collisions: false
    inter-object-collisions: true  # ENABLE inter-object collision for this cube

    ## XPBD-specific options
    num-solver-iters: 5
    num-local-collision-iters: 3  # extra collision iterations
    solver-type: "Gauss-Seidel"
    constraint-type: "Stable-Neohookean-Combined"
    residual-policy: "Never"


  ## Second deformable cube
  -
    name: "Cube2"
    type: "XPBDMeshObject"
    filename: "../resource/cube/cube8.msh"
    materials: ["Soft Tissue"]

    ## visualization options
    color: [0.0, 0.0, 1.0, 1.0] # blue cube
    draw-points: false
    draw-edges: true
    draw-faces: true

    ## initial configuration
    max-size: 0.5   # 0.5m cube
    position: [0.3, 0, 0.5]   # positioned to the right, lower than cube1
    velocity: [-0.1, 0, 0]   # moving left - will collide with cube1
    rotation: [0, 0, 0]

    ## collisions
    collisions: true
    self-collisions: false
    inter-object-collisions: true  # ENABLE inter-object collision for this cube

    ## XPBD-specific options
    num-solver-iters: 5
    num-local-collision-iters: 3  # extra collision iterations
    solver-type: "Gauss-Seidel"
    constraint-type: "Stable-Neohookean-Combined"
    residual-policy: "Never"


  ## Ground plane (optional - uncomment if you want a floor)
