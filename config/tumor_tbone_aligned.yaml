## 测试配置：Tumor + Tbone 对齐
## 使用 use-original-coords 来保持 MeshLab 中的对齐

name: "Tumor-Tbone-Aligned"
description: "Test tumor and tbone alignment using original coordinates"

visualization: "Easy3D"
g-accel: 0
sim-mode: "AFAP"
time-step: 1e-4
collision-rate: 100
fps: 30
end-time: 5

materials:
  -
    name: "Soft Tissue"
    density: 1000
    E: 2e5
    nu: 0.45
    mu-s: 0.0
    mu-k: 0.0

objects:
  # Tumor (deformable)
  -
    name: "Tumor"
    type: "FirstOrderXPBDMeshObject"
    filename: "../resource/tissue/neuroma_tet.msh"
    materials: ["Soft Tissue"]
    
    color: [1.0, 0.5, 0.0, 1.0]
    draw-points: false
    draw-edges: true
    draw-faces: true
    
    max-size: 1.0
    position: [0, 0, 0]
    velocity: [0, 0, 0]
    rotation: [0, 0, 0]
    
    # 关键设置：使用原始坐标，保持与 MeshLab 中相同的位置
    use-original-coords: true
    
    collisions: true
    num-solver-iters: 3
    solver-type: "Gauss-Seidel"
    constraint-type: "Stable-Neohookean-Combined"
    residual-policy: "Never"
    damping-multiplier: 250000

  # Tbone (rigid)
  - 
    name: "TBone"
    type: "RigidMeshObject"
    filename: "../resource/bone/tbone_remeshed03.obj"
    density: 100
    
    position: [0, 0, 0]
    rotation: [0, 0, 0]
    velocity: [0, 0, 0]
    angular-velocity: [0, 0, 0]
    
    max-size: 1.0
    
    # 关键设置：使用原始坐标，保持与 MeshLab 中相同的位置
    use-original-coords: true
    
    collisions: true
    fixed: true
