## TBone-Tumor-Brain Adhesion Test Configuration
## Complete test with:
##   1. Rigid TBone mesh
##   2. Deformable Tumor mesh
##   3. Deformable Brain mesh
## Adhesion constraints:
##   - Inter-deform adhesion: Tumor ↔ Brain
##   - Rigid-deform adhesion: TBone ↔ Tumor

name: "TBone-Tumor-Brain Adhesion Test"
description: "Testing rigid-deform and inter-deform adhesion with three objects"

visualization: "Easy3D"

g-accel: 0 # downward acceleration due to gravity [m/s2]

sim-mode: "AFAP"     # Run as fast as possible for testing

time-step: 2e-4      # 0.5ms timestep
collision-rate: 100  # Hz: 100 times per second = every 0.01s (was 10 = every 0.1s, too sparse!)
collision-algorithm: "embree"  # Use Embree BVH for fast collision detection
fps: 60              # frames per second of the visualization
end-time: 300        # test time [s]

## ==================== GRASPING/PUSHING TOOL SETTINGS ====================
grasp-radius: 0.013   # Grasping tool radius: 13mm (default 100mm)
tool-radius: 0.013    # Pushing tool radius: 13mm (default 200mm)

## ==================== INTER-DEFORM ADHESION SETTINGS ====================
## Adhesion between two deformable objects (Tumor ↔ Brain)
inter-deform-adhesion-enable: false
inter-deform-adhesion-rest-gap: 0.002        # 2mm rest gap (scaled for 50mm objects)
inter-deform-adhesion-break-ratio: 1.5       # Break at 50% strain
inter-deform-adhesion-alpha: 1e-5            # Compliance (stiffness)
inter-deform-adhesion-bond-distance: 0.005   # 5mm bond distance (scaled for 50mm objects)
inter-deform-adhesion-fixed-triangle-object: false  # Both objects are deformable

## ==================== RIGID-DEFORM ADHESION SETTINGS ====================
## Adhesion between rigid objects and deformable tissue (TBone ↔ Tumor)
rigid-deform-adhesion-enable: true           # Enable rigid-deform adhesion
rigid-deform-adhesion-rest-gap: 0.002        # 2mm rest gap - target separation distance
rigid-deform-adhesion-break-ratio: 2.5       # Break at 100% strain (separation = 2x rest_gap)
rigid-deform-adhesion-alpha: 2e-7            # Compliance (lower = stiffer spring)
rigid-deform-adhesion-bond-distance: 0.01    # 5mm - initial search radius for creating bonds

## define elastic materials
materials:
  -
    name: "Soft Tissue"
    density: 1000   # density [kg/m^3]
    E: 5e4          # Young's modulus [Pa] - moderate stiffness
    nu: 0.45        # Poisson's ratio [-]
    mu-s: 0.0       # coefficient of static friction [-]
    mu-k: 0.0       # coefficient of kinetic friction [-]

## objects in the simulation
objects:

  ## ==================== DEFORMABLE TUMOR ====================
  -
    name: "Tumor"
    type: "FirstOrderXPBDMeshObject"
    filename: "../resource/tumor_fixed/tumor_squeezed.obj"

    materials: ["Soft Tissue"]

    ## visualization options
    color: [1.0, 0.5, 0.0]  # Orange - tumor
    draw-points: false
    draw-edges: true
    draw-faces: true

    ## initial configuration
    use-original-coords: true   # Center and scale mesh
    max-size: 0.05               # Scale to 50mm (0.05m)
    position: [-0.0, 0.0, 0.0]    # LEFT: -30mm to avoid overlap!
    velocity: [0.0, 0, 0.0]      # Stationary
    rotation: [0, 0, 0]

    ## collisions
    collisions: true
    inter-object-collisions: true  # Enable inter-object collision with brain

    ## XPBD-specific options
    num-solver-iters: 3
    solver-type: "Gauss-Seidel"
    constraint-type: "Stable-Neohookean-Combined"
    residual-policy: "Never"
    damping-multiplier: 2000000  # Reduced from 5M (was too stiff)


  ## ==================== DEFORMABLE BRAIN ====================
  -
    name: "Brain"
    type: "FirstOrderXPBDMeshObject"
    filename: "../resource/brain_fixed/brain_scale03.obj"

    materials: ["Soft Tissue"]

    ## visualization options
    color: [0.0, 1.0, 1.0]  # Cyan - brain
    draw-points: false
    draw-edges: true
    draw-faces: true

    ## initial configuration
    use-original-coords: true   # Center and scale mesh
    max-size: 0.05               # Scale to 50mm (0.05m)
    position: [0.0, 0.0, 0.0]    # RIGHT: +30mm to avoid overlap!
    velocity: [0.0, 0, 0.0]      # Stationary
    rotation: [0, 0, 0]

    ## collisions
    collisions: true
    inter-object-collisions: true

    ## XPBD-specific options
    num-solver-iters: 3
    solver-type: "Gauss-Seidel"
    constraint-type: "Stable-Neohookean-Combined"
    residual-policy: "Never"
    damping-multiplier: 2000000 


  ## ==================== RIGID TBONE ====================
  -
    name: "RigidBone"
    type: "RigidMeshObject"
    filename: "../resource/tbone_fixed/tbone_ds06.obj"
    density: 1000

    ## visualization options
    color: [0.95, 0.92, 0.85]  # Bone white
    draw-points: false
    draw-edges: true
    draw-faces: true

    ## initial configuration
    use-original-coords: true   # Center and scale mesh
    max-size: 0.05               # Scale to 50mm max dimension (same as deformables)
    position: [0.0, 0.0, 0.0]    # UP: +30mm to avoid overlap!
    rotation: [0, 0, 0]          # No rotation
    velocity: [0, 0, 0]
    angular-velocity: [0, 0, 0]

    ## physics
    collisions: true   # Enable collisions with deformable objects
    fixed: true        # Keep bone stationary


## ==================== CONSTRAINT INFO ====================
# Objects:
#   Tumor - deformable
#   Brain - deformable  
#   RigidBone - rigid, fixed
#
# Constraints:
#   1. Inter-deform adhesion: Tumor ↔ Brain
#      Code: Simulation.cpp L2234 (looks for "Tumor" & "Brain")
#      Vertex-to-face bonds when distance < 5mm, breaks at 50% strain
#
#   2. Rigid-deform adhesion: RigidBone ↔ Tumor
#      Code: Simulation.cpp L2517 (rigid:"RigidBone" + deform:"Tumor"/"Brain"/"Tissue"/"DeformableMesh")
#      Face centroid-to-SDF bonds when distance < 5mm, breaks at 100% strain
#
#   3. Inter-object collision: Tumor ↔ Brain
#      Embree BVH spatial acceleration, prevents interpenetration
