  ## ==================== RIGID TBONE ====================
  -
    name: "RigidBone"
    type: "RigidMeshObject"
    filename: "../resource/tbone_fixed/tbone_MOD.obj"
    density: 1000      # Normal bone density (not critical when fixed=true)

    ## visualization options
    color: [0.95, 0.92, 0.85]  # Bone white
    draw-points: false
    draw-edges: true
    draw-faces: true

    ## initial configuration
    use-original-coords: true   # Center and scale mesh
    max-size: 0.05               # Scale to 50mm max dimension (same as deformables)
    position: [0.0, 0.0, 0.0]    # UP: +30mm to avoid overlap!
    rotation: [0, 0, 0]          # No rotation
    velocity: [0, 0, 0]
    angular-velocity: [0, 0, 0]

    ## physics
    collisions: true   # Enable collisions with deformable objects
    fixed: true        # ✅ Keep bone stationary (realistic for medical scenarios)
                       # Adhesion will still work because:
                       # 1. Bug #2 fix ensures rigid body weight is included in lambda calculation
                       # 2. Deformable tissue receives correctly scaled force
                       # 3. Modified breaking logic accounts for fixed bone
                       # 4. Tissue can stretch toward bone without over-stretching

## ==================== CONSTRAINT INFO ====================
# Objects:
#   Tumor - deformable
#   Brain - deformable  
#   RigidBone - rigid, fixed
#
# Constraints:
#   1. Inter-deform adhesion: Tumor ↔ Brain
#      Code: Simulation.cpp L2234 (looks for "Tumor" & "Brain")
#      Vertex-to-face bonds when distance < 5mm, breaks at 50% strain
#
#   2. Rigid-deform adhesion: RigidBone ↔ Tumor
#      Code: Simulation.cpp L2517 (rigid:"RigidBone" + deform:"Tumor"/"Brain"/"Tissue"/"DeformableMesh")
#      Face centroid-to-SDF bonds when distance < 5mm, breaks at 100% strain
#
#   3. Inter-object collision: Tumor ↔ Brain
#      Embree BVH spatial acceleration, prevents interpenetration
