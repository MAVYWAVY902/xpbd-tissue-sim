## ==================== CONSTRAINT INFO ====================
# Objects:
#   Tumor - deformable
#   Brain - deformable  
#   RigidBone - rigid, fixed
#
# Constraints:
#   1. Inter-deform adhesion: Tumor ↔ Brain
#      Code: Simulation.cpp L2234 (looks for "Tumor" & "Brain")
#      Vertex-to-face bonds when distance < 5mm, breaks at 50% strain
#
#   2. Rigid-deform adhesion: RigidBone ↔ Tumor
#      Code: Simulation.cpp L2517 (rigid:"RigidBone" + deform:"Tumor"/"Brain"/"Tissue"/"DeformableMesh")
#      Face centroid-to-SDF bonds when distance < 5mm, breaks at 100% strain
#
#   3. Inter-object collision: Tumor ↔ Brain
#      Embree BVH spatial acceleration, prevents interpenetration
