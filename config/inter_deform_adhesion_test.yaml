## Inter-Deformable Adhesion Test Configuration
## Tests adhesion constraint between two deformable objects (cube1 and cube2)
## This uses the new InterDeformDeformAdhesionConstraint

name: "Inter-Deformable Adhesion Test"
description: "Testing deformable-deformable adhesion between two cubes with manual constraint setup"

visualization: "Easy3D"

g-accel: 0 # downward acceleration due to gravity [m/s2]

sim-mode: "AFAP"     # Run as fast as possible for testing

time-step: 2e-4   # OPTIMIZED: Larger timestep since rigid bone is fixed (2x speedup)
collision-rate: 100  # OPTIMIZED: Reduced since bone doesn't move (2x speedup)
collision-algorithm: "embree"  # Options: "auto", "brute-force", "embree" 
fps: 60 # frames per second of the visualization
end-time: 200 # test time - shorter for quick benchmarking

## ==================== GRASPING/PUSHING TOOL SETTINGS ====================
grasp-radius: 0.013   # Grasping tool radius: 13mm (default 100mm)
tool-radius: 0.013    # Pushing tool radius: 13mm (default 200mm)


## ==================== ADHESION SETTINGS ====================
# OPTIMIZED FOR FIXED RIGID OBJECT (bone never moves)
inter-deform-adhesion-enable: true
inter-deform-adhesion-rest-gap: 0.002        # 2mm rest gap (scaled for 50mm objects)
inter-deform-adhesion-break-ratio: 1.5       # Allow more stretch before breaking
inter-deform-adhesion-alpha: 1e-5            # Moderate stiffness
inter-deform-adhesion-bond-distance: 0.005   # 5mm bond distance (scaled for 50mm objects)

# CRITICAL OPTIMIZATION: Specify which object is fixed
# If bone (Cube2) is fixed, set this to true to enable fast path
inter-deform-adhesion-fixed-triangle-object: true  # Triangle object (bone) is rigid and fixed
# Note: You'll need to add code in Simulation.cpp to read these and create constraints

## define elastic materials
materials:
  -
    name: "Soft Tissue"
    density: 1000   # density [kg/m^3]
    E: 5e4    # Young's modulus [Pa] - moderate stiffness
    nu: 0.45  # Poisson's ratio [-]
    mu-s: 0.0 # coefficient of static friction [-]
    mu-k: 0.0 # coefficient of kinetic friction [-]

## objects in the simulation
objects:

  ## First deformable cube (LEFT - will be pulled by external force)
  -
    name: "Cube1"
    type: "FirstOrderXPBDMeshObject"
    filename: "../resource/tumor_fixed/tumor_fixed01.obj"
    # filename: "../resource/tissue/neuroma_tet.msh"

    materials: ["Soft Tissue"]

    ## visualization options
    color: [1.0, 0.0, 0.0] # red cube
    draw-points: false
    draw-edges: true
    draw-faces: true

    ## initial configuration - positioned close to Cube2
    use-original-coords: false   # DISABLE to allow positioning
    max-size: 0.05              # Scale to 50mm (0.05m)
    position: [0.0, 0.0, 0.0]     # Center at origin
    velocity: [0.0, 0, 0.0]      # START STATIONARY - let adhesion pull gradually
    rotation: [0, 0, 0]

    ## collisions
    collisions: true
    inter-object-collisions: true  # Enable inter-object collision

    ## XPBD-specific options
    num-solver-iters: 3  # OPTIMIZED: Fixed rigid allows faster convergence (was 8)
    solver-type: "Gauss-Seidel"  # SWITCH TO GAUSS-SEIDEL FOR SPEED AND STABILITY
    # solver-type: "Jacobi"       # Jacobi is too slow with 30 iterations

    constraint-type: "Stable-Neohookean-Combined"
    residual-policy: "Never"
    
    damping-multiplier: 1000000  # Moderate damping


  ## Second deformable cube (RIGHT - will be stuck to Cube1 via adhesion)
  -
    name: "Cube2"
    type: "FirstOrderXPBDMeshObject"
    filename: "../resource/brain_fixed/brain_scale01.obj"
    materials: ["Soft Tissue"]

    ## visualization options
    color: [0.0, 1.0, 1.0] # blue cube
    draw-points: false
    draw-edges: true
    draw-faces: true

    ## initial configuration - positioned close to Cube1
    use-original-coords: false   # DISABLE to allow positioning
    max-size: 0.05              # Scale to 50mm (0.05m)
    position: [0.0, 0.0, 0.0]     # Center at origin (overlapping with Cube1)
    velocity: [-0.0, 0, 0]        # Stationary initially (will be pulled by adhesion)
    rotation: [0, 0, 0]

    ## collisions
    collisions: true
    inter-object-collisions: true  # Enable inter-object collision

    ## XPBD-specific options
    num-solver-iters: 3  # OPTIMIZED: Fixed rigid allows faster convergence (was 8)
    solver-type: "Gauss-Seidel"  # SWITCH TO GAUSS-SEIDEL FOR SPEED AND STABILITY
    # solver-type: "Jacobi"       # Jacobi is too slow with 30 iterations

    constraint-type: "Stable-Neohookean-Combined"
    residual-policy: "Never"
    
    damping-multiplier: 1000000  # Moderate damping


  # ## Ground plane for reference
  # -
  #   name: "ground"
  #   type: "RigidBox"
  #   size: [5, 5, 0.1]
  #   density: 100000
  #   position: [0, 0, 0.85]  # Just below the cubes
  #   rotation: [0, 0, 0]
  #   velocity: [0, 0, 0]
  #   fixed: true
  #   collisions: true


## ==================== TESTING NOTES ====================
