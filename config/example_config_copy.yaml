## NOTE: not all parameters below are required - the Simulation class and all Object classes have many default parameters

name: "Example"  # name of the simulation
description: "Example simulation" # description of the simulation

visualization: "VTK" # Use VTK for texture mapping support (change to 'Easy3D' if not using textures)

g-accel: 0 # downward acceleration due to gravity (in the z-direction) [m/s2]

## different simulation "modes"
sim-mode: "Frame-by-frame"  # "Frame-by-frame" lets you advance the simulation one frame at a time by pressing any key
# sim-mode: "Visualization"     # "Visualization" runs the simulation at 'real-time' such that sim time = wall clock time
# sim-mode: "AFAP"            # "AFAP" runs the simulation As Fast As Possible, without caring if sim time is going faster than wall clock time

time-step: 2e-4   # simulation time step [s]
collision-rate: 100 # rate at which to run collision detection [Hz] 
fps: 30 # frames per second of the visualization (i.e. how often to redraw graphics)
end-time: 100 # end time of the simulation [s]
# fix-max-z: true           # Fix top vertices to create "ceiling attachment"

# nerve stretch constraint testing
# To enable/disable nerve constraints for comparison tests, use environment variables:
# export NERVE_ENABLE=1        # Enable nerve constraints (default)
# export NERVE_ENABLE=0        # Disable nerve constraints for comparison
# export NERVE_MSH="../resource/cube/cube8_nerve.msh"  # Path to mesh with nerve lines
# export NERVE_PHYS="nerve_edge"  # Name of physical line in mesh (default)

## define elastic materials
materials:
  -
    name: "Soft Tissue"
    density: 1000   # density [kg/m^3]
    E: 8e3    # Young's modulus [Pa]
    nu: 0.45  # Poisson's ratio [-]
    mu-s: 1.1 # coefficient of static friction [-]
    mu-k: 0.7 # coefficient of kinetic friction [-]

## objects in the simulation
objects:

  ## example textured object (use RigidMeshObject for testing texture first)
  -
    name: "Tumor_Textured"

    ## type of object - using RigidMeshObject for texture testing
    type: "RigidMeshObject"  # Rigid object (easier to see texture without deformation)
    # type: "FirstOrderXPBDMeshObject"  # Uncomment for deformable object
    # type: "XPBDMeshObject"          # use the standard, 2nd-order XPBD method

    ## filename to load from (.msh is GMSH's volumetric mesh format, but if .obj or .stl is provided, will automatically turn surface mesh to volume mesh)
    # filename: "../resource/general/stanford_bunny_lowpoly.msh"
    # filename: "../resource/cube/cube8.msh"
    # filename: "../resource/general/single.msh"
    # filename: "../resource/cube/cube8_nerve_y.msh"
    # filename: "../resource/cube/cube16.msh"
    # filename: "../resource/beam/10x1x1_subdivided16_beam.msh"
    # filename: "../resource/tissue/Prostate.msh"
    # filename: "../resource/tissue/Trachea_processed.stl"
    # filename: "../resource/tissue/tracheal_tumor.msh"
    filename: "../resource/tumor_fixed/tumor_fixed01.obj"  # Original OBJ without UV for testing shape first
    # filename: "../resource/tumor_fixed/tumor_fixed01_with_uv.obj"  # OBJ with UV (re-export from Blender first!)

    # materials: ["Soft Tissue"] # Only needed for deformable objects
    
    ## PNG texture file (COMMENTED OUT until tumor_fixed01_with_uv.obj is correctly re-exported)
    # texture-file: "../resource/textures/AlbedoLiver2.png"  # Uncomment after fixing UV file
    
    ## visualization options
    color: [1.0, 0.5, 0.3]  # Orange tumor color
    # color: [1.0, 1.0, 1.0]  # Use white when applying texture (uncomment with texture-file)
    draw-points: false  # draw mesh points
    draw-edges: true    # draw mesh edges (set to false when using texture for clearer view)
    draw-faces: true    # draw mesh faces

    ## initial configuration
    use-original-coords: true   # Allow position adjustment
    max-size: 1.0               # Keep original size (no scaling)
    position: [0, 0, 0]          # Will be centered at origin
    velocity: [0, 0, 0.0]        # initial velocity [m/s]
    rotation: [0, 0, 0]          # No rotation

    ## Physics (for RigidMeshObject)
    density: 100
    collisions: false   # Disabled for simple visualization
    fixed: true  # Keep stationary to see texture clearly

    ## XPBD-specific options (only used if type is FirstOrderXPBDMeshObject)
    # num-solver-iters: 3
    # solver-type: "Gauss-Seidel"
    # constraint-type: "Stable-Neohookean-Combined"
    # residual-policy: "Never"
    # damping-multiplier: 2000000
  



