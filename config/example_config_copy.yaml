  # rigid mesh
  - 
    name: "tbone_v1"
    type: "RigidMeshObject"
    filename: "../resource/tbone_fixed/tbone_ds06.obj"  # Reformatted to match working tbone_800 format
    density: 100
    
    ## visualization options
    # color: [0.95, 0.92, 0.85]  # COMMENTED OUT - Using MTL file material instead
