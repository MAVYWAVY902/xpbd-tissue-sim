name: "Virtuoso Prostate (Easy3D)"
visualization: "Easy3D"
background-image: "../resource/rendering/hdr/surgery_1k.png"

# Tissue grasping simulation-specific parameters
input-device: "Mouse"
show-tip-cursor: false

g-accel: 0 # m/s2
sim-mode: "AFAP"
time-step: 1e-3 # for FO XPBD
collision-rate: 100
fps: 30
end-time: 5000

materials:
  -
    name: "Raw Chicken Breast"
    density: 1000
    E: 0.07e6
    nu: 0.49

objects:

  -
    name: "Cube1"
    type: "FirstOrderXPBDMeshObject"
    filename: "../resource/demos/prostate/bph_new_contrast_d.msh"
    materials: ["Raw Chicken Breast"]
    max-size: 0.0857
    position: [0, 0, -0.005]
    velocity: [0, 0, 0]
    rotation: [90, 180, 0]
    num-solver-iters: 1
    num-local-collision-iters: 5
    residual-policy: "Never"
    solver-type: "Gauss-Seidel"
    constraint-type: "Stable-Neohookean-Combined"
    damping-multiplier: 400000000
    collisions: true
    self-collisions: false

    # Easy3D rendering settings
    color: [1.0, 0.3, 0.2]
    draw-points: false
    draw-edges: true
    draw-faces: true

  -
    name: "Robot"
    type: "VirtuosoRobot"
    position: [0.002, -0.03, 0.01]
    rotation: [-70, 180, 0]
    collisions: true
    color: [0.7, 0.7, 0.7]

    arms:
    -
      name: "Arm1"
      type: "VirtuosoArm"
      tool-type: "grasper"
      outer-tube-diameter: 1.56e-3
      outer-tube-radius-of-curvature: 1.5383e-2
      outer-tube-distal-straight-length: 5e-3
      outer-tube-translation: 7e-3
      outer-tube-rotation: 30
      inner-tube-rotation: 30
      inner-tube-diameter: 1.04e-3
      inner-tube-translation: 15e-3
