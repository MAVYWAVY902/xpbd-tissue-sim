## Rigid + Soft Pushing Demo (Rigid Cube + Deformable Tissue)
## Runs with the PushingTest executable and your existing PushingSimulation logic

name: "Rigid-Soft Pushing (Cube)"
description: "Deformable tissue pushed by a user-controlled spherical tool, interacting with a fixed rigid cube obstacle."

visualization: "Easy3D"      # 'Easy3D' for viewer, 'None' for headless

g-accel: 0                    # gravity in z [m/s^2]; 0 for a neutral testbed

# Recommended for interactive pushing
sim-mode: "AFAP"     # Visualization runs in real-time for smooth mouse interaction

enable-mouse-interaction: true
input-device: "Mouse"

# Global sim timing
# Balanced settings: stable but reasonable performance
# If your mesh is stiff or contact rich, reduce dt or increase collision-rate

time-step: 1e-3               # [s] - smaller for stability but not too small
collision-rate: 1000          # [Hz] - good collision resolution without overkill
fps: 30                       # visualization FPS
end-time: 1000               # [s]

# Materials
materials:
  - name: "Soft Tissue"
    density: 1000             # [kg/m^3]
    E: 6e4                    # [Pa]
    nu: 0.45                  # [-]
    mu-s: 0.0                 # static friction
    mu-k: 0.0                 # kinetic friction

# PushingSimulation parameters (tool tip)
tool-radius: 0.05             # [m] much smaller to avoid sharp contact areas  
push-stiffness: 50.0           # very gentle for ill-shaped tets
max-push-force: 20.0           # very low force cap
fix-min-z: true               # pin bottom-most vertices (helps avoid drift during pushing)

# Scene objects
objects:
  # Deformable tissue to push
  - name: "Tissue"
    type: "FirstOrderXPBDMeshObject"
    # Alternative: type: "XPBDMeshObject"

    # Provide a mesh. If you have a volumetric .msh, prefer that.
    # If .obj/.stl is provided, the system will tetrahedralize it at load.
    # Pick one that you know works well in your setup:
    # filename: "../resource/cube/cube8.msh"  # Using known-good mesh to avoid Easy3D errors
    # filename: "../resource/general/single.msh"
    filename: "../resource/tissue/neuroma_refined_uniform.obj"

    materials: ["Soft Tissue"]

    # Visuals - simplified to avoid Easy3D buffer issues
    color: [0.85, 0.35, 0.25, 1.0]
    draw-points: false
    draw-edges: false   # disable edge drawing to avoid buffer mismatches
    draw-faces: true

    # Placement (cube positioned above bone for pushing demo)
    max-size: 1.0
    position: [0.0, 0.0, 0.8]   # cube above bone for clear contact
    rotation: [0, 0, 0]
    velocity: [0, 0, 0]

    collisions: true

    # XPBD tuning - Balanced performance/stability
    num-solver-iters: 4       # sufficient iterations without overkill
    solver-type: "Gauss-Seidel"
    constraint-type: "Stable-Neohookean-Combined"
    residual-policy: "Never"

    # First-Order XPBD damping (ignored by classic XPBD)
    damping-multiplier: 800000  # strong damping but not extreme

  # Fixed rigid bone acting as obstacle
  - name: "RigidBone"
    type: "RigidMeshObject"
    filename: "../resource/bone/tbone_remeshed01.obj"
    # filename: "../resource/tissue/neuroma_segmentation_decimated_2000.obj"  # Using known-good mesh to avoid Easy3D errors
    density: 1000             # density only affects mass when fixed: false
    position: [0.0, 0.0, 0.0] # place bone near the origin; tissue starts above
    rotation: [0, 0, 0]
    velocity: [0, 0, 0]
    angular-velocity: [0, 0, 0]
    fixed: true               # keep it static
    collisions: true          # enable rigid-soft contact
    max-size: 1.0             # scale the bone appropriately

  # # Fixed rigid cube acting as a "bone" or obstacle
  # # This is for soft cube pushing demo
  # - name: "RigidCube"
  #   type: "RigidBox"
  #   size: [1.6, 1.6, 0.015]     # [x, y, z] meters
  #   density: 1000             # density only affects mass when fixed: false
  #   position: [0.53, 0.1, 0.8] # place cube near the origin; tissue starts above
  #   rotation: [0, -90, 0]
  #   velocity: [0, 0, 0]
  #   angular-velocity: [0, 0, 0]
  #   fixed: true               # keep it static
  #   collisions: true          # enable rigid-soft contact