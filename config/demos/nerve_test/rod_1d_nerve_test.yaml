## 1D Rod Nerve Constraint Evaluation Test
## Pure 1D rod testing for stretch and bending constraints isolation
## Built on existing framework with nerve constraint toggles for debugging
##
## Usage: ./HangingTest rod_1d_nerve_test.yaml

name: "1D Rod Nerve Constraint Evaluation"
description: "Isolated testing of nerve stretch and bending constraints on 1D rod - no hydrostatic/deviatoric interference"

# Nerve configuration - TOGGLE SWITCHES for constraint debugging
nerve-enable: true                                   # Master switch for nerve constraints
nerve-stretch-enable: true                          # TOGGLE: Enable/disable stretch constraints
nerve-bending-enable: true                          # TOGGLE: Enable/disable bending constraints  
nerve-mesh-file: "../resource/rod/rod_1d_test.msh"  # Pure 1D rod mesh (no tets)
nerve-physical-group: "nerve_edge"                  # Physical group for nerve constraints

visualization: "Easy3D"
g-accel: 9.81             # Gravity to create deformation and test constraint response

sim-mode: "Visualization"  # Real-time visualization for debugging
time-step: 1e-3           # Small timestep for numerical stability
collision-rate: 1000      
fps: 60                   # Smooth visualization
end-time: 30              # Long enough to observe steady-state behavior

# Graphics configuration for 1D rod visibility
graphics:
  camera:
    eye: [4.0, 4.0, 2.0]         # Move camera far back for full view
    center: [0.0, 0.0, 1.0]      # Look at center of rod  
    up: [0.0, 0.0, 1.0]          # Z-axis up
    field-of-view-y: 60.0        # Wide field of view
  window-size: [1200, 900]       # Large window
  sphere-radius-multiplier: 10.0  # Make vertices very visible
  line-width-multiplier: 20.0     # Make edges very thick
  background-color: [0.1, 0.1, 0.1, 1.0]  # Dark background for contrast

# Constraint: Fix top end (hanging rod simulation) - DISABLED due to NaN on face-less meshes
fix-max-z: false           # OFF until AABB-from-vertices is implemented (prevents NaN errors)

materials:
  -
    name: "Soft Tissue"     # Use standard tissue material name (matches existing configs)
    density: 1000           # kg/m³ - standard tissue density
    E: 1e4                  # Pa - Soft Young's modulus (like hanging_beam_test.yaml) for visible deformation
    nu: 0.45                # Poisson's ratio - standard tissue value
    mu-s: 0.0               # Static friction - no friction for pure constraint testing
    mu-k: 0.0               # Kinetic friction

objects:
  ## 1D Rod object - ONLY nerve constraints will be active
  -
    name: "Rod1D"
    type: "FirstOrderXPBDMeshObject"         # Use first-order XPBD for nerve constraints
    filename: "../resource/rod/rod_1d_test.msh"  # TEMPORARY: Use known working mesh for visualization test
    materials: ["Soft Tissue"]
    
    ## Use Nerve-Only constraint configuration for pure nerve constraint testing
    # constraint-type: "Stable-Neohookean-Combined"   # Would add Neo-Hookean constraints if tetrahedra exist
    constraint-type: "Nerve-Only"   # ONLY nerve stretch/bending + collision constraints, no elastic
    
    ## Visualization optimized for 1D rod - ESSENTIAL settings
    color: [1.0, 0.0, 0.0, 1.0]  # Bright red for maximum visibility
    draw-points: true             # Show vertices as dots - CRITICAL for 1D visualization
    draw-edges: true              # Show rod as connected lines - ESSENTIAL for 1D
    draw-faces: false             # No faces in 1D mesh

    ## Initial configuration - Make rod clearly visible
    max-size: 2.0                 # Larger rod for better visibility
    position: [0, 0, 1.0]         # Center rod at z=1 (middle of screen)
    velocity: [0, 0, 0]          
    rotation: [0, 0, 0]           # Rod aligned along Z-axis (vertical)

    ## Disable collision testing for now (1D mesh collision support may be limited)
    collisions: false             # Disable collision system for 1D rod

    ## XPBD solver settings optimized for 1D rod
    num-solver-iters: 15          # More iterations for bending constraint convergence
    solver-type: "Gauss-Seidel"   # Proven solver for nerve constraints
    residual-policy: "Never"      # Skip residual calculation for performance

    ## 1st-Order XPBD damping for stability
    damping-multiplier: 100000    # Moderate damping for realistic motion

  ## Collision object disabled for 1D rod testing
  # -
  #   name: "CollisionPlane"
  #   type: "RigidBox" 
  #   size: [1.0, 1.0, 0.02]        # Thin platform
  #   density: 1000
  #   position: [0.25, 0, 0.1]      # Place below rod center
  #   rotation: [0, 0, 0]
  #   velocity: [0, 0, 0]
  #   angular-velocity: [0, 0, 0]
  #   fixed: true                   # Keep platform static
  #   collisions: true              # Enable rod-platform collision testing
  #   
  #   ## Nerve parameters (disabled for rigid objects)
  #   nerve-enable: false           # No nerve constraints for rigid objects
  #   nerve-stretch-enable: false
  #   nerve-bending-enable: false
  #   nerve-mesh-file: ""           # Empty for disabled nerve constraints
  #   nerve-physical-group: ""      # Empty for disabled nerve constraints