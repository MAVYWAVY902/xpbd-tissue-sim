## Ellipsoid Adhesion Test Configuration
## Tests the fixed adhesion constraint implementation with ellipsoid geometry

name: "Ellipsoid Adhesion Test"
description: "Test single-sided adhesion constraints with proper breakage on ellipsoid tumor"

# adhesion parameters (STRAIN-BASED MODEL)
nerve-tumor-adhesion-enable: true                 # Enable adhesion constraint testing
nerve-tumor-adhesion-distance-window: 0.1         # 10cm detection window (must exceed max initial separation!)
nerve-tumor-adhesion-alpha: 1e-9                  # STRONGER: Stiffer adhesion to overcome mass imbalance (was 1e-7)
nerve-tumor-adhesion-break-ratio: 1.2             # VERY HIGH: prevent breaking during testing

# OLD PARAMETERS (deprecated, no longer used):
# nerve-tumor-adhesion-target-gap: 0.05           # UNUSED - each constraint now uses its own d_0
# nerve-tumor-adhesion-break-distance: 0.37       # UNUSED - replaced by break-ratio 

# nerve configuration
nerve-mesh-file: "../resource/rod/linear_rod.msh"  # Nerve mesh for constraint setup
nerve-physical-group: "nerve_edge"                   # Default physical group name

nerve-stretch-enable: true
nerve-bending-enable: true

nerve-stretch-alpha: 1e-11   # Stronger nerve stretch (smaller alpha = stiffer)
nerve-bending-alpha: 1e-9   # Stronger nerve bending (smaller alpha = stiffer)
nerve-verbose: true



# constraint-type-specific nerve control (new feature!)
stable-neohookean-nerve-stretch-enable: false         # Enable/disable nerve stretch for Stable-Neohookean
stable-neohookean-nerve-bending-enable: false         # Enable/disable nerve bending for Stable-Neohookean
stable-neohookean-combined-nerve-stretch-enable: false  # DISABLED for tumor (example)
stable-neohookean-combined-nerve-bending-enable: false   # DISABLED for tumor (example)

visualization: "Easy3D"
g-accel: 0.0              # Standard gravity

sim-mode: "Visualization"   # Real-time visualization  
time-step: 1e-3            # 1ms time step for stability
collision-rate: 1000       
fps: 30                    # Smooth visualization
end-time: 600               # 10 seconds test


enable-mouse-interaction: true
input-device: "Mouse"


materials:
  -
    name: "Ellipsoid Tumor"
    density: 100    # DRASTICALLY REDUCED: Make tumor very light so adhesion can pull it (was 1000, then 100)
    E: 2e5         # Much softer material to prevent explosion
    nu: 0.45        # Standard soft tissue Poisson's ratio
    mu-s: 0.0       # coefficient of static friction [-]
    mu-k: 0.0       # coefficient of kinetic friction [-]
  -
    name: "Nerve Rod"
    density: 1000    # density [kg/m^3] 
    E: 1e4          # Young's modulus [Pa] - stiffer nerve
    nu: 0.3         # Poisson's ratio [-]
    mu-s: 0.0       # coefficient of static friction [-]
    mu-k: 0.0       # coefficient of kinetic friction [-]

objects:
  ## Ellipsoid tumor - deformable with surface triangles
  -
    name: "EllipsoidTumor"
    type: "FirstOrderXPBDMeshObject"
    # filename: "../resource/tissue/ellipsoid_tumor_with_surfaces.msh"
    filename: "../resource/cube/cube8.msh"
    materials: ["Ellipsoid Tumor"]
    
    ## visualization
    color: [0.6, 0.8, 0.4, 0.7]  # semi-transparent green
    draw-points: false
    draw-edges: false  
    draw-faces: true

    ## initial configuration
    # max-size: 1.0    # REMOVED - use original size
    # position: [0.5, 0.48, 0.4]    # Old position
    position: [0.0, 0.0, 0.0]    # Tumor at origin for close contact with nerve
    velocity: [0, 0, 0]    
    rotation: [0, 0, 0]     

    ## physics
    collisions: true  # disable collision to prevent self-intersection issues

    ## XPBD solver settings
    num-solver-iters: 20              # INCREASED: More iterations for constraint convergence
    solver-type: "Gauss-Seidel"
    constraint-type: "Stable-Neohookean-Combined"  # simpler constraint type
    residual-policy: "Never"
    damping-multiplier: 100000    # Standard damping from working configs

  ## Nerve rod - 1D rod following ellipsoid surface  
  -
    name: "SurfaceNerve"
    type: "FirstOrderXPBDMeshObject"
    # filename: "../resource/rod/ellipsoid_rod_surface_mesh.msh"
    filename: "../resource/rod/linear_rod.msh"
    materials: ["Nerve Rod"]
    
    ## visualization
    # color: [1.0, 0.2, 0.2, 1.0]  # DISABLED to allow per-vertex coloring
    draw-points: true
    draw-edges: true
    draw-faces: false

    ## initial configuration  
    # max-size: 1.0    # REMOVED - use original size
    position: [0.56, 0.0, 0.0]    # NOW WORKS! Nerve positioned at origin (close to tumor)
    velocity: [0, 0, 0.0]     # No movement initially
    rotation: [0, 0, 0]        # NOW WORKS! Can rotate nerve via YAML

    ## physics
    collisions: false  
    
    ## Ensure nerve is NOT fixed - all vertices free to move
    fixed-vertices: []  # Empty list = no fixed vertices

    ## XPBD solver settings
    num-solver-iters: 20              # INCREASED: More iterations for constraint convergence
    solver-type: "Gauss-Seidel"
    constraint-type: "Nerve-Only"  # nerve constraints only
    residual-policy: "Never"
    damping-multiplier: 100000
    
