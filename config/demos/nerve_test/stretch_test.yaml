## Stretch Test for Nerve Constraint Validation
## This scene demonstrates the contribution of nerve stretch constraints
## by applying stretching forces to a tissue sample with embedded nerve fibers

name: "Nerve Stretch Test"
description: "Stretch test to demonstrate nerve constraint contribution"

visualization: "Easy3D"
g-accel: 0.0  # Disable gravity for clean stretch test

sim-mode: "Visualization"
time-step: 5e-4    # Smaller timestep for stability during stretching
collision-rate: 1000
fps: 30
end-time: 10.0     # 10 seconds of stretching

## Materials - softer tissue to show deformation clearly
materials:
  -
    name: "Soft Tissue"
    density: 1000
    E: 5e3        # Lower Young's modulus for easier deformation
    nu: 0.45
    mu-s: 0.0
    mu-k: 0.0

## Objects
objects:
  ## Main tissue sample with nerve fibers
  -
    name: "TissueWithNerve"
    type: "FirstOrderXPBDMeshObject"
    
    ## Use a rectangular tissue sample (like a tendon or muscle strip)
    filename: "../resource/cube/cube8_nerve.msh"  # Contains nerve line definitions
    
    material: "Soft Tissue"
    
    ## Solver settings for stability during stretching
    solver-type: "Gauss-Seidel"
    constraint-type: "Stable-Neohookean-Combined"
    constraint-solver-iterations: 20    # More iterations for accuracy
    damping-multiplier: 0.02           # Light damping for stability
    
    ## Rendering - show both surface and wireframe to see deformation
    render:
      vertices: true
      edges: true
      faces: true
      vertex-color: [1.0, 0.8, 0.6]    # Tissue color
      edge-color: [0.2, 0.2, 0.2]      # Dark edges
      face-color: [1.0, 0.8, 0.6]
      
  ## Fixed anchor point (left end)
  -
    name: "LeftAnchor"
    type: "RigidBox"
    
    # Position at left end of tissue
    position: [-0.1, 0.0, 0.0]
    orientation: [0, 0, 0]
    
    # Small anchor box
    size: [0.05, 0.3, 0.3]
    
    # Fixed in space
    fixed: true
    
    render:
      faces: true
      face-color: [0.7, 0.7, 0.7]  # Gray anchor
      
  ## Moving stretcher (right end) - this will be controlled to stretch the tissue
  -
    name: "RightStretcher"
    type: "RigidBox"
    
    # Position at right end of tissue
    position: [0.35, 0.0, 0.0]
    orientation: [0, 0, 0]
    
    # Small stretcher box
    size: [0.05, 0.3, 0.3]
    
    # This will move to create stretching
    fixed: false
    
    # Add linear motion to create stretching
    # Note: You'll need to implement kinematic motion or use external forces
    
    render:
      faces: true
      face-color: [0.8, 0.2, 0.2]  # Red stretcher