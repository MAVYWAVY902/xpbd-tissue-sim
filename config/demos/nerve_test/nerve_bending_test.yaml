## Nerve Bending Constraint Test Configuration
## This test uses HangingTest executable to demonstrate both stretch and bending constraints
## The beam hangs from the ceiling and shows bending resistance along the nerve
##
## Usage:
##   ./HangingTest nerve_bending_test.yaml  # Now uses YAML configuration instead of environment variables

name: "Nerve Bending Constraint Test"
description: "Test nerve stretch and bending constraints - beam hanging with bending resistance"

# Nerve configuration - controls stretch and bending constraints
nerve-enable: false                                         # Master switch for nerve constraints
nerve-stretch-enable: true                                # Enable/disable stretch constraints
nerve-bending-enable: true                                # Enable/disable nerve constraints
nerve-mesh-file: "../resource/beam/beam_nerve_y_all.msh"  # Mesh file containing nerve lines
nerve-physical-group: "nerve_edge"                        # Physical group name in mesh

visualization: "Easy3D"
g-accel: 14.81             # Standard gravity will pull the beam down

sim-mode: "Visualization"  # Real-time visualization
time-step: 1e-3           # 1ms time step for stability
collision-rate: 1000      
fps: 60                   # Smooth visualization
end-time: 30              # 30 seconds to observe stretching and bending

# HangingTest-specific parameter
fix-max-z: true           # Fix top vertices to create "ceiling attachment"

materials:
  -
    name: "Soft Tissue"
    density: 1000   # density [kg/m^3]
    E: 2e3    # Young's modulus [Pa]
    nu: 0.45  # Poisson's ratio [-]
    mu-s: 0.0 # coefficient of static friction [-]
    mu-k: 0.0 # coefficient of kinetic friction [-]

objects:
  ## Beam-like tissue object for bending test
  -
    name: "BendingBeam"
    type: "FirstOrderXPBDMeshObject"  # Use first-order XPBD for nerve constraints
    filename: "../resource/beam/beam_nerve_y_all.msh"  # Mesh with nerve lines
    materials: ["Soft Tissue"]
    
      ## visualization options
    color: [0.8, 0.4, 0.8, 1.0] # purple color to distinguish from stretch-only test
    draw-points: false  # draw mesh points
    draw-edges: true    # draw mesh edges
    draw-faces: true    # draw mesh faces

    ## initial configuration
    max-size: 1   # size of largest model dimension (preserves aspect ratio)
    position: [0, 0, 0]   # initial position of mesh center of mass [m]
    velocity: [0, 0, 0.0]   # initial velocity [m/s]
    rotation: [0, 0, 0]     # initial rotation [deg] (specified as XYZ Euler angles)

    ## collisions
    collisions: true

    ## XPBD-specific options
    num-solver-iters: 3   # slightly more iterations for bending constraints
    
    solver-type: "Gauss-Seidel"   # use Gauss-Seidel solver
    constraint-type: "Stable-Neohookean-Combined"   # use combined constraints

    residual-policy: "Never"              # don't compute the residuals

    ## 1st-Order XPBD options
    damping-multiplier: 1000000   # 'b' from the 1st-Order XPBD paper


  - name: "RigidSphere"
    type: "RigidSphere"
    radius: 0.20                 # radius in meters
    density: 1000             # density only affects mass when fixed: false
    position: [0.0, 0.1, -0.35] # place sphere near the origin; tissue starts above
    rotation: [0, 0, 0]       # rotation not as relevant for spheres
    velocity: [0, 0, 0]
    angular-velocity: [0, 0, 0]
    fixed: true               # keep it static
    collisions: true          # enable rigid-soft contact
