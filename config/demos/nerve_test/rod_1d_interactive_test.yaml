## Interactive 1D Rod — Test Nerve Constraints with Mouse
## Based on simple_pushing + nerve constraint physics

name: "1D Rod — Interactive Nerve Testing"
description: "Test nerve stretch + bending constraints by pushing/dragging the free end of the rod"
visualization: "Easy3D"

g-accel: 0.0       # Disable gravity to focus on nerve constraints only
sim-mode: "Visualization"     # Real-time simulation for interactive testing
enable-mouse-interaction: true
input-device: "Mouse" 

time-step: 1e-3   # Smaller timestep for hard constraints (DisMech typically uses ~1ms)
collision-rate: 1000
fps: 30
end-time: 10000   # Long simulation for testing

fix-min-z: true   # Fix the start (z=0.0)
fix-max-z: true   # Fix the end (z=1.0)

## Nerve constraint configuration
nerve-enable: true
nerve-stretch-enable: true
nerve-bending-enable: true
nerve-mesh-file: "../resource/rod/linear_rod.msh"
nerve-physical-group: "nerve_edge"

## CRITICAL: Alpha values for nerve constraint stiffness
## In XPBD: SMALLER alpha = STIFFER constraint (inverse relationship!)
## Alpha = compliance parameter (strain per unit force)
##
## Recommended values for nerve-like behavior:
## - Very stiff nerve (almost rigid): 1e-12 to 1e-11
## - Stiff nerve (realistic):         1e-11 to 1e-10
## - Moderate stiffness:               1e-10 to 1e-9
## - Soft (current config):            1e-9  to 1e-8
##
## For realistic nerve that resists stretching/bending but still deforms:
nerve-stretch-alpha: 1e-13   # Much stiffer stretch (was 1e-9, 100x softer)
nerve-bending-alpha: 1e-12   # Stiff bending (was 1e-9, 10x softer)
nerve-verbose: true

## PushingSimulation-specific parameters for interactive testing
tool-radius: 0.01        # Smaller tool for precise rod manipulation
push-stiffness: 25.0     # Moderate stiffness for smooth interaction
max-push-force: 15.0     # Reasonable force for nerve constraint testing

materials:
  -
    name: "Soft Tissue"
    density: 100
    E: 5e7
    nu: 0.45
    mu-s: 0.0
    mu-k: 0.0

objects:
  - name: "Rod1D"
    type: "FirstOrderXPBDMeshObject"
    # type: "XPBDMeshObject"
    
    filename: "../resource/rod/linear_rod.msh"
    materials: ["Soft Tissue"]
    solver-type: "Gauss-Seidel"
    constraint-type: "Nerve-Only"   # Pure nerve constraint physics (stretch/bend provide elastic restoring force!)
    
    ## CRITICAL: More iterations for hard constraints to converge properly
    num-solver-iters: 40   # DisMech uses 10-50 iterations for stiff rods
    
    ## Too small (< 10000): underdamped → oscillates/bounces
    ## Just right (10000-100000): critical damping → fast snap-back, stops quickly
    ## Too large (> 1000000): overdamped → slow, viscous motion
    damping-multiplier: 10000   # Target critical damping for nerve-like behavior 

    # Fix both ends of the rod
    fixed-vertices: [0, 299]  # Fix start (z=1) at vertex 0 and end (z=0) at vertex 299

    # Visualization settings
    draw_points: true
    draw_edges: true
    draw_faces: false
    color: [1.0, 0.2, 0.2, 1.0]  # Red rod