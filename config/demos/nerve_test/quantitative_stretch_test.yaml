## Enhanced Stretch Test with Quantitative Measurements
## This config adds logging to measure nerve constraint effectiveness

name: "Nerve Stretch Quantitative Test"
description: "Quantitative stretch test measuring nerve constraint effectiveness"

visualization: "Easy3D"
g-accel: 0.0

sim-mode: "Visualization"
time-step: 5e-4
collision-rate: 1000
fps: 30
end-time: 5.0

## Enable logging for quantitative analysis
logging: true
logging-output-dir: "./nerve_test_results/"

materials:
  -
    name: "Test Tissue"
    density: 1000
    E: 1e4       # Moderate stiffness
    nu: 0.45
    mu-s: 0.0
    mu-k: 0.0

objects:
  -
    name: "StretchSample"
    type: "FirstOrderXPBDMeshObject"
    filename: "../resource/cube/cube8_nerve.msh"
    material: "Test Tissue"
    
    solver-type: "Gauss-Seidel"
    constraint-type: "Stable-Neohookean-Combined"
    constraint-solver-iterations: 15
    damping-multiplier: 0.01
    
    render:
      vertices: true
      edges: true
      faces: true
      vertex-color: [1.0, 0.7, 0.5]
      edge-color: [0.8, 0.0, 0.0]    # Red edges to highlight nerve lines
      face-color: [1.0, 0.7, 0.5]