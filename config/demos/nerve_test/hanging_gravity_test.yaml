## Gravity Stretch Test - Simulating Hanging Beam with Ceiling Attachment
## This recreates your example_config.yaml scene but with fixed top vertices (ceiling attachment)
## Perfect for comparing nerve stretch constraint effects under gravity
##
## Usage:
##   ./HangingTest hanging_beam_test.yaml  # Now uses YAML configuration
##   (Set nerve-enable: false in YAML to disable constraints for comparison)

name: "Vertically Hanging Beam Test for Stretch Constraint"
description: "Gravity stretch test with fixed top vertices - compare nerve constraint effects"

# Nerve configuration - controls constraint types separately
nerve-enable: true                                        # Master switch for nerve constraints
nerve-stretch-enable: false                                # Enable/disable stretch constraints
nerve-bending-enable: false                                # Enable/disable bending constraints  
nerve-mesh-file: "../resource/beam/y2z_beam_nerve_y_all.msh"  # Mesh file containing nerve lines
nerve-physical-group: "nerve_edge"                        # Physical group name in mesh

visualization: "Easy3D"
g-accel: 9.81             # Standard gravity will pull the beam down

sim-mode: "Visualization"  # Real-time visualization
time-step: 1e-3           # 1ms time step for stability
collision-rate: 1000      
fps: 60                   # Smooth visualization
end-time: 30              # 30 seconds to observe stretching

# HangingTest-specific parameter
fix-max-z: true           # Fix top vertices to create "ceiling attachment"

materials:
  -
    name: "Soft Tissue"
    density: 1000   # density [kg/m^3]
    E: 2e3    # Young's modulus [Pa]
    nu: 0.45  # Poisson's ratio [-]
    mu-s: 0.0 # coefficient of static friction [-]
    mu-k: 0.0 # coefficient of kinetic friction [-]

objects:
  ## Beam-like tissue object for hanging test
  -
    name: "HangingBeam"
    type: "FirstOrderXPBDMeshObject"  # Use first-order XPBD for nerve constraints
    filename: "../resource/beam/y2z_beam_nerve_y_all.msh"  # Mesh with nerve lines
    materials: ["Soft Tissue"]
    
      ## visualization options
    color: [1.0, 0.5, 0.0, 1.0] # uniform color of the mesh
    draw-points: false  # draw mesh points
    draw-edges: true    # draw mesh edges
    draw-faces: true    # draw mesh faces

    ## initial configuration
    max-size: 1   # size of largest model dimension (preserves aspect ratio)
    # size: [1, 1, 1]   # specify size of each dimension
    position: [0, 0, 0]   # initial position of mesh center of mass [m]
    velocity: [0, 0, 0.0]   # initial velocity [m/s] (applied to all vertices in the deformable mesh)
    rotation: [0, 0, 0]     # initial rotation [deg] (specified as XYZ Euler angles)

    ## collisions
    collisions: true

    ## XPBD-specific options
    num-solver-iters: 2   # number of solver loop iterations per time step 
    
    solver-type: "Gauss-Seidel"   # use Gauss-Seidel solver (i.e. update mesh after every constraint projection)
    # solver-type: "Jacobi"       # use Jacobi solver (i.e. update mesh only after going through every constraint projection)
    # solver-type: "Parallel-Jacobi"  # use parallelized Jacobi solver (note: unstable and requires GPU)

    constraint-type: "Stable-Neohookean-Combined"   # use Stable Neohookean constraints with 2x2 block constraint solve for each tet element
    # constraint-type: "Stable-Neohookean"          # use Stable Neohookean constraints with separate constraint solve for each tet element

    # residual-policy: "Every-Substep"    # compute the residuals after every time step
    residual-policy: "Never"              # don't compute the residuals

    ## 1st-Order XPBD options (has no effect on XPBDMeshObject)
    damping-multiplier: 1000000   # 'b' from the 1st-Order XPBD paper


