## Minimal 1D Rod — Nerve stretch + bending (only)
## Based on expert recommendation for clean visualization debugging

name: "1D Rod — Nerve stretch + bending (only)"
visualization: "Easy3D"

time-step: 1e-4   # Smaller time step for stability
end-time: 10.0
g-accel: 0.0       # Disable gravity to focus on nerve constraints only

fix-max-z: false               # OFF until AABB-from-vertices is implemented

nerve-enable: true
nerve-stretch-enable: true
nerve-bending-enable: true
nerve-mesh-file: "../resource/rod/rod_1d_test.msh"
nerve-physical-group: "nerve_edge"

nerve-stretch-alpha: 1e-2   # Increase stretch constraint strength
nerve-bending-alpha: 1e-3   # Increase bending constraint strength
nerve-verbose: true

materials:
  -
    name: "Soft Tissue"
    density: 1000
    E: 1e4
    nu: 0.45
    mu-s: 0.0
    mu-k: 0.0

objects:
  - name: "Rod1D"
    # type: "FirstOrderXPBDMeshObject"
    type: "XPBDMeshObject"
    
    filename: "../resource/rod/rod_1d_test.msh"
    materials: ["Soft Tissue"]
    solver-type: "Gauss-Seidel"
    # constraint-type: "Stable-Neohookean-Combined"   # keep to hit the dispatch
    constraint-type: "Nerve-Only"   # keep to hit the dispatch
    num-solver-iters: 20

    # Fix only first vertex to allow testing nerve constraints with free end
    fixed-vertices: [0]  # Only fix start, let end be free for interaction

    # Proper underscored draw keys (not hyphenated)
    draw_points: true
    draw_edges: true
    draw_faces: false
    color: [1.0, 0.2, 0.2, 1.0]