## Haptic Dissection Demo
## Haply Inverse3 haptic device + knife tool + adhesion-based tissue cutting
## Falls back to mouse/keyboard if no device is connected.
##
## Based on tbone_tumor_brain_adhesion_test.yaml — includes TBone + Tumor
## with rigid-deform adhesion that the knife can cut through.

name: "Haptic Dissection"
description: "Interactive haptic dissection with Haply Inverse3 force feedback"

visualization: "Easy3D"

g-accel: 0
sim-mode: "AFAP"
enable-mouse-interaction: true
input-device: "Mouse"

time-step: 3e-4
collision-rate: 100
collision-algorithm: "embree"
fps: 60
end-time: 10000

## ==================== PUSHING TOOL SETTINGS ====================
tool-radius: 0.065         # knife mesh scale (same as tbone test)
knife-position: [0.01, 0.0, 0.0]
knife-rotation: [0, 0, 0]
push-stiffness: 2000.0     # same as tbone test
push-damping: 0.7           # same as tbone test
max-push-force: 8.0
fix-min-z: false

## ==================== HAPTIC DEVICE SETTINGS ====================
device-to-sim-axes: [1, 2, -3]         # signed permutation: device→sim axis mapping (press M to cycle, N for diagnostics)
knife-rotation-speed: 1.0
haptic-force-scaling: 5.0
haptic-serial-port: ""            # empty = auto-detect /dev/ttyACM*
contact-force-stiffness: 500.0
force-filter-alpha: 0.3
haptic-workspace-radius: 0.20
sim-workspace-radius: 0.05

## ==================== RIGID-DEFORM ADHESION (TBone ↔ Tumor) ====================
rigid-deform-adhesion-enable: true
rigid-deform-adhesion-interaction-type: "unified-distance"

rigid-deform-adhesion-alpha: 1e-7
rigid-deform-adhesion-bond-distance: 0.0348
rigid-deform-adhesion-break-ratio: 1.27
rigid-deform-adhesion-stretch-abs-min: 0.005

## Unified-distance curve parameters
rigid-deform-adhesion-d-contact: 0.0003
rigid-deform-adhesion-d-rest: 0.0032
rigid-deform-adhesion-d-neutral-start: 0.005
rigid-deform-adhesion-d-neutral-end: 0.005
rigid-deform-adhesion-d-bond: 0.005

## ==================== MATERIALS ====================
materials:
  -
    name: "Soft Tissue"
    density: 1000
    E: 8e4
    nu: 0.45
    mu-s: 1.2
    mu-k: 0.8

## ==================== OBJECTS ====================
objects:

  ## Deformable Tumor
  -
    name: "Tumor"
    type: "FirstOrderXPBDMeshObject"
    filename: "../resource/tumor_fixed/tumor_squeezed_uv03.obj"
    materials: ["Soft Tissue"]

    draw-points: false
    draw-edges: false
    draw-faces: true

    texture-file: "../resource/textures/AlbedoFat.png"
    use-texture: true

    collisions: true
    inter-object-collisions: false

    use-original-coords: true
    max-size: 0.05
    position: [0.0, 0.0, 0.0]
    velocity: [0.0, 0, 0.0]
    rotation: [0, 0, 0]

    num-solver-iters: 2
    solver-type: "Gauss-Seidel"
    constraint-type: "Stable-Neohookean-Combined"
    residual-policy: "Never"
    damping-multiplier: 7500000

  ## Rigid TBone
  -
    name: "RigidBone"
    type: "RigidMeshObject"
    filename: "../resource/tbone_fixed/tbone_MOD4.obj"
    density: 1000

    color: [0.95, 0.92, 0.85]
    draw-points: false
    draw-edges: true
    draw-faces: true

    use-original-coords: true
    max-size: 0.05
    position: [0.0, 0.0, 0.0]
    rotation: [0, 0, 0]
    velocity: [0, 0, 0]
    angular-velocity: [0, 0, 0]

    collisions: true
    fixed: true
