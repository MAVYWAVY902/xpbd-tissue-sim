## TBone-Tumor-Brain Adhesion Test Configuration
## Complete test with:
##   1. Rigid TBone mesh
##   2. Deformable Tumor mesh
##   3. Deformable Brain mesh
## Adhesion constraints:
##   - Inter-deform adhesion: Tumor ↔ Brain
##   - Rigid-deform adhesion: TBone ↔ Tumor

name: "TBone-Tumor-Brain Adhesion Test"
description: "Testing rigid-deform and inter-deform adhesion with three objects"

visualization: "Easy3D"

g-accel: 0 # downward acceleration due to gravity [m/s2]

sim-mode: "AFAP"     # Run as fast as possible for testing

time-step: 1e-4      # 0.5ms timestep
collision-rate: 1000  # Hz: 1000 times per second = every step! (prevents tunneling/severe penetration)
collision-algorithm: "embree"  # Use Embree BVH for fast collision detection
fps: 60              # frames per second of the visualization
end-time: 300        # test time [s]

## ==================== SOLVER SELECTION ====================
## Choose between XPBD (constraint projection) and VBD (energy minimization)
solver-type: xpbd              # Options: "xpbd" or "vbd"

## VBD-specific parameters (Tuned for oscillatory behavior with low damping)
vbd-iterations: 3            # More iterations for convergence (Gaia default: 5-10)
vbd-step-size: 1.0            # Standard step size
vbd-use-full-hessian: true    # Use complete Hessian matrix
vbd-damping: 0.02             # Rayleigh damping: 1% per step (Gaia typical: 0.0-0.05)

## XPBD-specific parameters (baseline for comparison)
xpbd-iterations: 5           # XPBD iterations per timestep (baseline reference)

## ==================== GRASPING/PUSHING TOOL SETTINGS ====================
grasp-radius: 0.007   # Grasping tool radius: 13mm (default 100mm)
tool-radius: 0.007    # Pushing tool radius: 13mm (default 200mm)
fix-min-z: false      # CRITICAL: Disable automatic bottom fixing for ALL objects (GraspingTest/PushingTest default=true)

## ==================== INTER-DEFORM ADHESION SETTINGS ====================
## Adhesion between two deformable objects (Tumor ↔ Brain)
inter-deform-adhesion-enable: true          # Re-enable this!
inter-deform-adhesion-rest-gap: 0.0015       # 1.5mm rest gap (Used for breaking check, but init uses actual dist)
inter-deform-adhesion-break-ratio: 1.5       # Increase break ratio to 1.5 (allow 50% stretch before break)
inter-deform-adhesion-alpha: 0.00005          # Balanced: 5x softer than original (prevents explosion), 10x stiffer than frozen 
inter-deform-adhesion-bond-distance: 0.005   
inter-deform-adhesion-fixed-triangle-object: false

## ==================== RIGID-DEFORM ADHESION SETTINGS ====================
## Unified sticky collision constraint between rigid objects and deformable tissue (TBone ↔ Tumor)
## Uses RigidDeformStickyCollisionConstraint (combines collision + adhesion in one constraint)
rigid-deform-adhesion-enable: true
rigid-deform-adhesion-rest-gap: 0.002          # Equilibrium adhesive gap distance (m)
rigid-deform-adhesion-break-ratio: 1.8         # Strain ratio threshold: breaks at 180% (allow 80% stretch)
                                               # Increased from 1.3 to allow more realistic stretching
rigid-deform-adhesion-alpha: 1e-6              # Base compliance (will be adjusted dynamically: 5e-4 to 1e-4)
                                               # This is mostly ignored as evaluate() sets it dynamically
rigid-deform-adhesion-bond-distance: 0.005     # Maximum distance to create adhesion bond (m)

## define elastic materials
materials:
  -
    name: "Soft Tissue"
    density: 1000   # density [kg/m^3]
    E: 1e5          # Increased from 5e4 to 1e6 (More rigid Tumor)
    nu: 0.4         # Slightly lower Poisson's ratio
    mu-s: 0.0       # coefficient of static friction [-]
    mu-k: 0.0       # coefficient of kinetic friction [-]

## objects in the simulation
objects:

  ## ==================== DEFORMABLE TUMOR ====================
  -
    name: "Tumor"
    type: "FirstOrderXPBDMeshObject"  # CHANGED: Second order for VBD compatibility
    filename: "../resource/tumor_fixed/tumor_squeezed.obj"

    materials: ["Soft Tissue"]

    ## visualization options
    color: [1.0, 0.5, 0.0]  # Orange - tumor
    draw-points: false
    draw-edges: true
    draw-faces: true

    ## initial configuration
    use-original-coords: true   # Center and scale mesh
    max-size: 0.05               # Scale to 50mm (0.05m)
    position: [-0.03, 0.0, 0.0]    # LEFT: -30mm to avoid overlap!
    velocity: [0.0, 0, 0.0]      # Stationary
    rotation: [0, 0, 0]

    ## ==================== BOUNDARY FIXING (Tumor) ====================
    ## Optional: Fix tumor boundaries to simulate nerve root/vascular attachment
    ## NOTE: Uses 5% bbox tolerance for each direction (fixes a "slice" not a point)
    ## WARNING: Fixing ALL 6 directions will completely freeze the object!
    # fix-min-z: false       # Fix BOTTOM (posterior attachment) - can enable for nerve root
    # fix-max-z: false     # Fix TOP
    # fix-min-y: false     # Fix BACK (toward IAC/bone)
    # fix-max-y: false     # Fix FRONT
    # fix-min-x: false     # Fix LEFT (lateral)
    # fix-max-x: false     # Fix RIGHT (medial)

    ## collisions
    collisions: true
    inter-object-collisions: true  # Enable inter-object collision with brain

    ## XPBD-specific options
    num-solver-iters: 5
    solver-type: "Gauss-Seidel"
    constraint-type: "Stable-Neohookean-Combined"
    residual-policy: "Never"
    damping-multiplier: 5000000  # Removed: Second order doesn't use this parameter


