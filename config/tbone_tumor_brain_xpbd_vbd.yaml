  ## ==================== RIGID TBONE ====================
  -
    name: "RigidBone"
    type: "RigidMeshObject"
    filename: "../resource/tbone_fixed/tbone_MOD.obj"
    density: 1000

    ## visualization options
    color: [0.95, 0.92, 0.85]  # Bone white
    draw-points: false
    draw-edges: true
    draw-faces: true

    ## initial configuration
    use-original-coords: true   # Center and scale mesh
    max-size: 0.05               # Scale to 50mm max dimension (same as deformables)
    position: [0.0, 0.0, 0.0]    # UP: +30mm to avoid overlap!
    rotation: [0, 0, 0]          # No rotation
    velocity: [0, 0, 0]
    angular-velocity: [0, 0, 0]

    ## physics
    collisions: true   # Enable collisions with deformable objects
    fixed: true        # Keep bone stationary


## ==================== CONSTRAINT INFO ====================
# Objects:
#   Tumor - deformable
#   Brain - deformable (currently commented out)
#   RigidBone - rigid, fixed
#
# Constraints:
#   1. Inter-deform adhesion: Tumor ↔ Brain
#      Code: Simulation.cpp (looks for "Tumor" & "Brain")
#      Vertex-to-face bonds when distance < bond_distance, breaks at strain > break_ratio
#
#   2. Rigid-deform sticky collision: RigidBone ↔ Tumor
#      Code: Simulation.cpp (uses RigidDeformStickyCollisionConstraint)
#      Unified constraint: maintains rest_gap distance, breaks at strain > break_ratio
#      Modes: 
#        - Sticky (equality): C = distance - rest_gap = 0 (bi-directional force)
#        - Broken (inequality): C = distance >= 0 (collision only, no adhesion)
#
#   3. Inter-object collision: Tumor ↔ Brain
#      Embree BVH spatial acceleration, prevents interpenetration
